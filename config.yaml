debug: false             # Enable debug logging (DEBUG level) and screenshots
database: "creator.db"   # The SQLite account store. Must not be empty

chrome:
  headless: true
  timeout: 30s

proxy:
  # The proxy list is in the account store. Import it on the Proxies screen of serve mode.
  # With false, a run with no enabled proxy stops at start.
  direct: false          # Run with no proxy and ignore the list

email:
  # imap_host, imap_user and imap_domains are required. Put real values in config.local.yaml.
  # A failed login at start stops the run.
  imap_host: ""
  imap_port: 993
  imap_user: ""
  imap_pass: ""          # required when auth is password
  # The domains of the new addresses, for example [example.com, example.org]. Each attempt takes one at random.
  imap_domains: []
  auth: password         # password, or oauth2 for an XOAUTH2 login (Gmail, Outlook)
  oauth2:
    # With auth oauth2, client_id, refresh_token and token_url are required.
    # client_secret stays empty for a public client.
    client_id: ""
    client_secret: ""
    refresh_token: ""
    token_url: ""        # for example https://oauth2.googleapis.com/token

account:
  password_length: 16
  enable_totp: true          # enable 2FA (TOTP) setup after account creation

concurrency:
  max_workers: 10
  max_browsers: 0      # maximum live Chrome processes (0 = max_workers)
  account_count: 10    # total accounts to create (-1 = unlimited)
  account_timeout: 1m  # bound per attempt up to the password POST. The work after it adds up to 60 s
