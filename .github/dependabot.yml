version: 2
# While the workflows are disabled, scripts/local-ci.sh runs the checks on each pull request.
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # A release waits 7 days, so a yanked or bad publish gets no pull request.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
